version: "3.9"
services:
    backend :
      build: .
      ports:
        - "443:8000"
      env_file:
        - ./backend/.env
      networks:
        - app-network
      depends_on:
        - db

    db:
      image : postgres:15
      volumes:
        - data:/var/lib/postgresql/data
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: app_db

      networks:
        - app-network

    server:
      image  : nginx:latest
      port : "80:80"
      volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      depends_on:
      - backend
      networks:
      - app-network
volumes:
  data : 


networks:
  app-network:
    driver: bridge